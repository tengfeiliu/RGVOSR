model:
  flux_backend: flux2_klein
  flux_model_path: /data/models/FLUX.2-klein-base-4B
  dtype: bf16
  text_encoder_device: cpu
  text_encoder_dtype: fp32
  vae_device: cuda
  vae_dtype: fp32
  max_prompt_sequence_length: 512
  use_lora: true
  lora_backend: moe
  lora_rank: 32
  lora_alpha: 32
  gradient_checkpointing: false
  guidance_scale: 1.0
  latent_channels: 128
  context_dim: 15360
  lora_moe:
    num_routed_experts: 4
    top_k: 2
    latent_branch: stat_conv
    router_hidden_dim: 1024
    warmup_ratio: 0.1
    init_temperature: 2.0
    final_temperature: 0.7
    shared_always_active: true
    freeze_shared_during_warmup: true
    init_from_single_lora: null

text_encoding:
  # mode: online
  # cache_dir: null
  # strict: true
  # dtype: bf16
  # validate_prompt_hash: true
  mode: cached
  cache_dir: datasets/text_embed_cache/flux2_klein_fixed_sr_prompt
  strict: true
  dtype: bf16
  validate_prompt_hash: true

data:
  jsonl_path: datasets/LSDIR_unipercept_raw_cache/valid.cleaned.jsonl
  crop_size: 512
  scale: 4
  batch_size: 1
  num_workers: 4
  vae_align: 16

condition:
  use_prompt: false
  use_suggestions: false
  use_degradation_vector: false
  use_visual_semantic_tokens: false
  deg_vector_dim: 8
  deg_token_count: 0
  deg_hidden_dim: 512
  lr_cond_mode: flux2_image_concat
  lr_token_count: 1024
  condition_dropout: 0
  visual_feature_dim: 768
  visual_token_count: 64

training:
  stage: A
  freeze_flux_transformer: true
  unfreeze_last_n_blocks: 0
  max_steps: 20000
  lr_adapter: 1.0e-4
  lr_lora: 1.0e-4
  weight_decay: 0.01
  grad_accum_steps: 1
  save_every: 1000
  log_every: 1000
  output_dir: exp_rg_flux_sr
  logging_dir: logs
  report_to: none
  tracker_project_name: rg_flux_sr
  seed: 42
  use_8bit_adam: false
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  deepspeed_optimizer_offload_device: none
  lr_scheduler: constant_with_warmup
  lr_warmup_steps: 500
  lr_num_cycles: 1
  resume_ckpt: null
  auto_resume: false
  suffix: "_flux2_klein_lora_moe_smoke512_wo_loss"

flow_matching:
  sigma_sampling: uniform
  prediction_type: velocity
  timestep_conversion: sigma
  num_inference_steps: 25

evaluation:
  enabled: false
  eval_every: 500
  num_samples: 2
  num_inference_steps: 25
  metrics: [clipiqa, clipiqa+, nima, niqe, liqe, musiq, maniqa]
  jsonl_path: null
  output_dir: eval
  device: cuda

loss:
  fm_weight: 1.0
  latent_weight: 0.0
  perceptual_weight: 0.0
  router_div_weight: 1.0e-3
  router_entropy_weight: 1.0e-4
  router_balance_weight: 1.0e-4
